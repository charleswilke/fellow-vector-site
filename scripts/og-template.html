<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fellow Vector — social preview</title>
  <style>
    @font-face { font-family: VT323; src: url('../public/fonts/vt323-latin.woff2'); }
    @font-face { font-family: 'Share Tech Mono'; src: url('../public/fonts/share-tech-mono-latin.woff2'); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative;
      background: #241c13;
      color: #f1e5cd;
      font-family: 'Share Tech Mono', monospace;
    }
    body::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 80% 45%, #60412370, transparent 52%),
        radial-gradient(ellipse at 25% 30%, #392d1d, transparent 75%);
    }
    body::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(transparent 0 3px, #140e080c 3px 4px);
      box-shadow: inset 0 0 100px #100b0750;
    }
    .frame { position: absolute; inset: 26px; border: 1px solid #ffbd5926; }
    .frame::before, .frame::after { content: ''; position: absolute; width: 24px; height: 24px; border-color: #ffbd5990; border-style: solid; }
    .frame::before { left: -1px; top: -1px; border-width: 1px 0 0 1px; }
    .frame::after { right: -1px; bottom: -1px; border-width: 0 1px 1px 0; }
    main { position: absolute; top: 84px; left: 76px; z-index: 1; }
    .label { margin: 0 0 25px; color: #c5b496; font-size: 18px; letter-spacing: 3px; }
    h1 { margin: 0; color: #ffbd59; font: 106px/.88 VT323, monospace; letter-spacing: 4px; text-shadow: 0 0 7px #ffbd5945, 0 0 24px #ffbd591a; }
    .offer { margin: 30px 0 0; font-size: 25px; line-height: 1.45; }
    .message { margin: 17px 0 0; color: #c5b496; font-size: 20px; }
    .disk { position: absolute; width: 460px; height: 460px; top: 66px; right: 58px; transform: rotate(-5deg); }
    .disk > img { width: 100%; height: 100%; object-fit: contain; }
    .disk-note { position: absolute; top: 75px; left: 48px; margin: 0; color: #392d1d; font-size: 20px; line-height: 1.35; }
    .disk-note span { display: block; margin-top: 12px; font-size: 15px; }
    .disk > .portrait { position: absolute; top: 48px; right: 43px; width: 122px; height: 122px; }
    .bulb { position: absolute; width: 250px; height: 250px; object-fit: contain; top: 297px; right: 7px; transform: rotate(9deg); }
    footer { position: absolute; bottom: 65px; left: 76px; right: 76px; display: flex; justify-content: space-between; align-items: center; font-size: 17px; letter-spacing: 1px; }
    .url { color: #ffbd59; }
    .author { display: flex; align-items: baseline; gap: 14px; width: 350px; margin: 22px 0 0; padding-top: 15px; border-top: 1px solid #ffbd5940; color: #f1e5cd; font-size: 21px; }
    .author-label { color: #c5b496; font-size: 12px; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div class="frame" aria-hidden="true"></div>
  <main>
    <p class="label">// LEARN BY DOING</p>
    <h1>FELLOW<br>VECTOR</h1>
    <p class="offer">AI tutoring &amp; workshops.</p>
    <p class="message">Practical skills for your everyday work.</p>
    <p class="author"><span class="author-label">WITH</span><span>Charles Wilke</span></p>
  </main>
  <div class="disk">
    <img src="../src/assets/floppy-disk-note-v1.webp" alt="Vintage floppy disk with a paper label">
    <p class="disk-note">Bring your work.<br>Bring your questions.<span>We’ll start together.</span></p>
    <img class="portrait" src="../src/assets/cw4-cutout-hexagon.webp" alt="Illustrated portrait of Charles Wilke with an orange hexagon">
  </div>
  <img class="bulb" src="../src/assets/cw-bulb-amber.webp" alt="Smiling amber CW lightbulb">
  <footer><span class="url">fellowvector.com</span></footer>
</body>
</html>
